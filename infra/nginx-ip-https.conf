server {
 listen 443 ssl default_server;
 listen [::]:443 ssl default_server;
 server_name api.example.invalid;
 server_tokens off;
 ssl_certificate /etc/letsencrypt/live/kaifan-ip/fullchain.pem;
 ssl_certificate_key /etc/letsencrypt/live/kaifan-ip/privkey.pem;
 ssl_protocols TLSv1.2 TLSv1.3;
 ssl_session_cache shared:kaifan_tls:10m;
 ssl_session_timeout 1d;
 client_max_body_size 20m;
 add_header X-Content-Type-Options nosniff always;
 add_header Referrer-Policy no-referrer always;
 add_header X-Frame-Options DENY always;
 add_header Strict-Transport-Security "max-age=31536000" always;
 location /api/v1/ {
  proxy_pass http://127.0.0.1:3000;
  proxy_http_version 1.1;
  proxy_set_header Host $http_host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $remote_addr;
  proxy_set_header X-Forwarded-Proto https;
  proxy_set_header Connection "";
  proxy_buffering off;
  proxy_cache off;
  proxy_read_timeout 120s;
 }
 # Preserve Host and URI byte-for-byte: both participate in S3 SigV4 signing.
 location ^~ /shiku-photos/ {
  proxy_pass http://127.0.0.1:9000;
  proxy_http_version 1.1;
  proxy_set_header Host $http_host;
  proxy_set_header X-Forwarded-Proto https;
  proxy_set_header Connection "";
  proxy_request_buffering off;
  proxy_read_timeout 120s;
 }
 location /admin/ {
  proxy_pass http://127.0.0.1:3000;
  proxy_set_header Host $http_host;
  proxy_set_header X-Forwarded-Proto https;
 }
 location / { return 404; }
}
