# Only ACME validation is exposed before TLS is provisioned.
server {
 listen 80 default_server;
 listen [::]:80 default_server;
 server_name api.example.invalid;
 server_tokens off;
 location ^~ /.well-known/acme-challenge/ { root /var/lib/kaifan-acme; default_type text/plain; }
 location / { return 308 https://api.example.invalid$request_uri; }
}
