server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name site.example.invalid;
    root /var/www/site.example.invalid/public;
    index index.html;
    server_tokens off;
    ssl_certificate /etc/letsencrypt/live/site.example.invalid/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/site.example.invalid/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:kaifanghost_tls:2m;
    ssl_session_timeout 1d;
    access_log off;
    error_log /var/log/nginx/kaifanghost-error.log warn;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header X-Frame-Options DENY always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self'; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'none'; frame-ancestors 'none'; form-action 'none'" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Strict-Transport-Security "max-age=2592000" always;
    add_header Cache-Control "no-cache" always;
    gzip on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json font/ttf image/svg+xml;
    location = /_headers { return 404; }
    location ~ /\. { return 404; }
    location / { try_files $uri $uri/ =404; }
}
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name www.site.example.invalid;
    server_tokens off;
    ssl_certificate /etc/letsencrypt/live/site.example.invalid/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/site.example.invalid/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    access_log off;
    return 308 https://site.example.invalid$request_uri;
}
