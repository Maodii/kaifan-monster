# Enable only after ICP approval; separate name-based site, no API proxy changes.
server {
    listen 80;
    listen [::]:80;
    server_name site.example.invalid www.site.example.invalid;
    server_tokens off;
    access_log off;
    location ^~ /.well-known/acme-challenge/ {
        root /var/lib/kaifan-acme;
        default_type text/plain;
    }
    location / { return 308 https://site.example.invalid$request_uri; }
}
