<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>开饭小怪 · 使用守则</title><style>body{margin:0;background:#f8f4e8;color:#354e43;font-family:system-ui,-apple-system,sans-serif;line-height:1.9}main{max-width:880px;margin:auto;padding:40px 24px}h1{font-size:32px}p{white-space:pre-wrap;background:#fffdf6;padding:24px;border-radius:16px}a{color:#6e5781}img{max-width:100%;border-radius:16px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:18px}.note{background:#f2e5d1;padding:18px;border-radius:12px}small{color:#747266}</style><main><h1>使用守则</h1><p>让小怪帮你吃好每一餐
小怪可协助选菜、整理记餐草稿、检查库存和准备采购。云端回答使用阿里云百炼 API，AI 生成内容仅供参考。</p><p>先核对，再执行
扣减库存、保存菜谱或记餐等操作需先查看草稿，再由你确认。选图、拍照和上传也需主动操作。不要将尚未保存或上传的内容视为已经完成。</p><p>保护账号与隐私
不要输入密码、密钥、身份证号或他人敏感信息。不允许注入指令、冒用身份、攻击服务或访问他人数据。</p><p>适用范围
助手用于做饭、食材、采购、用餐记录和饮食计划，不用于通用编程、违法内容或医疗诊断。过敏、营养及食品安全信息请自行核实。</p></main></html>
