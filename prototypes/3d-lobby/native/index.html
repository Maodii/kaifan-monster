<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self' blob: file: resource:; font-src 'self'; base-uri 'none'; form-action 'none'">
<title>开饭小怪 · 3D 大厅</title><link rel="stylesheet" href="lobby.css"><script defer src="lobby.js"></script></head>
<body><main id="lobby"><header class="toolbar"><button id="simple" aria-label="切换简洁模式">简洁版</button><strong>开饭小怪</strong><button id="more" aria-label="打开全部功能">全部功能</button></header>
<section class="room-heading"><span id="room-kicker">今天也要好好吃饭</span><h1 id="room-title">我的小餐桌</h1><p id="room-summary" aria-live="polite"></p></section>
<section id="stage" aria-label="单指旋转、双指平移缩放、长按查看部件的实时场景"><canvas id="scene"></canvas><div id="loading" role="status"><img src="brand_monster.png" alt=""><span id="load-text">正在搬进小屋…</span><progress id="load-progress" max="100"></progress></div><div id="scene-labels"></div><button id="inspect-back" hidden>‹ 返回刚才视角</button><button id="gesture-hint" hidden aria-label="关闭操作提示">轻点物品 · 长按看细节 · 双指缩放 ×</button><section id="object-panel" aria-label="物品操作" hidden><div class="object-heading"><h2></h2><button class="object-close" aria-label="关闭物品操作">×</button></div><p aria-live="polite"></p><div class="object-actions"></div></section><div id="failure" hidden><p id="failure-text">3D 暂时无法打开</p><button id="retry">重新加载</button><button id="fallback">使用简洁版</button></div><div class="tools"><button id="objects" aria-label="选择场景中的物品">物品</button><button id="light" aria-label="切换昼夜光照">日 / 夜</button><button id="zoom-out" aria-label="缩小">−</button><button id="reset" aria-label="还原视角">↺</button><button id="zoom-in" aria-label="放大">＋</button></div></section>
<section class="room-actions"><button id="room-open">记下这一餐</button><button id="draw" aria-label="随机抽餐">今天吃什么？</button></section><nav id="rooms" aria-label="生活场景"></nav>
<dialog id="object-picker"><header><h2>摸摸屋里的小物</h2><button class="object-picker-close" aria-label="关闭物品目录">×</button></header><div class="object-list"></div></dialog><dialog id="feature-drawer"><header><h2>想做点什么？</h2><button id="close-drawer" aria-label="关闭全部功能">×</button></header><div id="feature-groups"></div></dialog><div id="toast" role="status"></div></main></body></html>
